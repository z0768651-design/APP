<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430">
  <rect width="920" height="430" fill="white"/>

  <defs>
    <marker id="arw" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8 Z" fill="black"/>
    </marker>
    <marker id="arw-both" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto-start-reverse">
      <path d="M0,0 L9,4 L0,8 Z" fill="black"/>
    </marker>
  </defs>

  <!-- ====== TOP-LEFT: PTAT PLOT ====== -->
  <!-- Y-axis -->
  <line x1="58" y1="178" x2="58" y2="25" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- X-axis -->
  <line x1="58" y1="178" x2="228" y2="178" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- V label -->
  <text x="48" y="28" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">V</text>
  <!-- Temp. label -->
  <text x="228" y="198" font-family="Arial, sans-serif" font-size="13" text-anchor="end">Temp.</text>
  <!-- PTAT line (positive slope) -->
  <line x1="70" y1="160" x2="210" y2="48" stroke="black" stroke-width="2.2"/>
  <!-- PTAT label -->
  <text x="120" y="78" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="black">PTAT</text>

  <!-- ====== BOTTOM-LEFT: CTAT PLOT ====== -->
  <!-- Y-axis -->
  <line x1="58" y1="385" x2="58" y2="232" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- X-axis -->
  <line x1="58" y1="385" x2="228" y2="385" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- V label -->
  <text x="48" y="235" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">V</text>
  <!-- Temp. label -->
  <text x="228" y="405" font-family="Arial, sans-serif" font-size="13" text-anchor="end">Temp.</text>
  <!-- CTAT line (negative slope) -->
  <line x1="70" y1="250" x2="210" y2="368" stroke="black" stroke-width="2.2"/>
  <!-- CTAT label -->
  <text x="125" y="345" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="black">CTAT</text>

  <!-- ====== RIGHT CURLY BRACE: PTAT → α ====== -->
  <path d="M 238,35  C 278,35  270,107  315,107
           M 315,107 C 270,107 278,178  238,178"
        stroke="black" stroke-width="2" fill="none"/>

  <!-- ====== RIGHT CURLY BRACE: CTAT → 1 ====== -->
  <path d="M 238,240 C 278,240 270,312 315,312
           M 315,312 C 270,312 278,385 238,385"
        stroke="black" stroke-width="2" fill="none"/>

  <!-- ====== α LABEL + ARROW TO ADDER ====== -->
  <text x="340" y="112" font-family="Arial, sans-serif" font-size="18" font-style="italic" text-anchor="middle">α</text>
  <line x1="340" y1="120" x2="392" y2="190" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ====== 1 LABEL + ARROW TO ADDER ====== -->
  <text x="340" y="308" font-family="Arial, sans-serif" font-size="18" text-anchor="middle">1</text>
  <line x1="340" y1="298" x2="392" y2="228" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ====== SUMMING JUNCTION ⊕ ====== -->
  <circle cx="400" cy="210" r="20" stroke="black" stroke-width="2.2" fill="white"/>
  <line x1="387" y1="210" x2="413" y2="210" stroke="black" stroke-width="2.2"/>
  <line x1="400" y1="197" x2="400" y2="223" stroke="black" stroke-width="2.2"/>

  <!-- ====== OUTPUT ARROW → RIGHT PLOT ====== -->
  <line x1="420" y1="210" x2="520" y2="210" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- ====== RIGHT: COMBINED PLOT ====== -->
  <!-- Y-axis -->
  <line x1="540" y1="360" x2="540" y2="52" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- X-axis -->
  <line x1="540" y1="360" x2="850" y2="360" stroke="black" stroke-width="1.5" marker-end="url(#arw)"/>
  <!-- V label -->
  <text x="530" y="55" font-family="Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="end">V</text>
  <!-- Temp. label -->
  <text x="845" y="380" font-family="Arial, sans-serif" font-size="13" text-anchor="end">Temp.</text>

  <!-- αV_PTAT: thin dashed line, positive slope -->
  <line x1="555" y1="320" x2="810" y2="92" stroke="black" stroke-width="1.3" stroke-dasharray="8,5"/>
  <!-- αV_PTAT label (subscript) -->
  <text x="815" y="88" font-family="Arial, sans-serif" font-style="italic">
    <tspan font-size="14">αV</tspan><tspan font-size="10" dy="4">PTAT</tspan>
  </text>

  <!-- V_CTAT: thin dashed line, negative slope -->
  <line x1="555" y1="92" x2="810" y2="320" stroke="black" stroke-width="1.3" stroke-dasharray="8,5"/>
  <!-- V_CTAT label (subscript) -->
  <text x="815" y="325" font-family="Arial, sans-serif" font-style="italic">
    <tspan font-size="14">V</tspan><tspan font-size="10" dy="4">CTAT</tspan>
  </text>

  <!-- Crossing point: x=(555+810)/2=682.5, y=(320+92)/2=206 -->
  <!-- Bandgap reference: thick solid nearly-flat line (the sum) -->
  <line x1="555" y1="198" x2="810" y2="201" stroke="black" stroke-width="3.5"/>

  <!-- Crossing-point marker (small X where the dashed lines meet) -->
  <!-- The lines cross at approximately (682, 206) -->
</svg>